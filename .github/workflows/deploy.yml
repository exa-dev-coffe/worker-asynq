name: Deploy Backend

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: write
  packages: write
  issues: write
  pull-requests: write

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Run Tests
        run: go test -v -race ./...

  deploy:
    needs: test
    uses: exa31/github-workflows/.github/workflows/backend.yml@v1.0.0
    with:
      app_name: worker-asynq
      namespace: asynq
      image_name: ghcr.io/exa-dev-coffe/worker-asynq
      rollout_timeout: 300s
      push_latest: true
      ssh_port: 31080
    secrets:
      GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
      SSH_KEY: ${{ secrets.SSH_KEY }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
